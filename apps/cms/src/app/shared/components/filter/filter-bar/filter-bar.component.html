<div class="filter-bar">
  <div class="filter-slots">
    <ng-content />
  </div>
  <div class="filter-actions">
    <button nz-button nzType="primary" [nzLoading]="loading" (click)="apply.emit()">
      <nz-icon nzType="search" />
      Lọc
    </button>
    @if (showReset) {
      <button nz-button (click)="reset.emit()">
        <nz-icon nzType="reload" />
        Đặt lại
      </button>
    }
  </div>
</div>
