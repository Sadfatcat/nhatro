<nz-modal
  [nzVisible]="visible"
  [nzTitle]="title"
  [nzWidth]="width"
  [nzFooter]="showFooter ? footerTpl : null"
  [nzMaskClosable]="!loading"
  [nzClosable]="!loading"
  (nzOnCancel)="onCancel()">
  <ng-container nzModalContent>
    <ng-content />
  </ng-container>
</nz-modal>

<ng-template #footerTpl>
  <button nz-button (click)="onCancel()" [disabled]="loading">{{ cancelText }}</button>
  <button nz-button nzType="primary" [nzDanger]="okDanger" [nzLoading]="loading" (click)="onOk()">
    {{ okText }}
  </button>
</ng-template>
