<div class="empty-wrap" [class.compact]="compact">
  <nz-empty [nzNotFoundContent]="contentTpl">
    <ng-template #contentTpl>
      <p class="empty-title">{{ title }}</p>
      @if (description) {
        <p class="empty-desc">{{ description }}</p>
      }
      @if (actionLabel) {
        <button nz-button nzType="primary" class="empty-action">
          @if (actionIcon) { <nz-icon [nzType]="actionIcon" /> }
          {{ actionLabel }}
        </button>
      }
    </ng-template>
  </nz-empty>
</div>
