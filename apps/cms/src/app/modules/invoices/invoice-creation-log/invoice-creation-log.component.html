<div class="creation-log">
  <app-filter-panel [config]="filterConfig()" (filterChange)="onFilterChange($event)" />

  <app-data-table
    [config]="tableConfig"
    [cellTemplates]="cellTemplates"
    (rowClick)="onRowClick($event)"
  >
    <ng-template #mobileCard let-row>
      <div class="invoice-log-card" (click)="onRowClick(row)">
        <div class="invoice-log-card__header">
          <strong>Phòng {{ row.roomNumber }}</strong>
          <app-status-badge [status]="row.status" />
        </div>
        <div class="invoice-log-card__body">
          <span>Kỳ {{ row.period }} · {{ row.tenantName }}</span>
          <app-money-display [value]="row.totalAmount" />
        </div>
        <div class="invoice-log-card__dates">
          <span>Tạo: {{ row.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
          <span>Hạn: {{ row.dueDate | date:'dd/MM/yyyy HH:mm' }}</span>
        </div>
      </div>
    </ng-template>
  </app-data-table>
</div>

<ng-template #statusTpl let-value>
  <app-status-badge [status]="value" />
</ng-template>

<ng-template #amountTpl let-value>
  <app-money-display [value]="value" />
</ng-template>

<ng-template #dateTpl let-value>
  {{ value | date:'dd/MM/yyyy HH:mm' }}
</ng-template>
