<div class="reading-log">
  <app-data-table
    [config]="tableConfig"
    [cellTemplates]="cellTemplates"
  />
</div>

<ng-template #elecTpl let-value>
  @if (value) {
    {{ value.prev }} → {{ value.curr }}
    <span class="reading-log__used">({{ value.curr - value.prev }} kWh)</span>
  } @else {
    <span class="reading-log__empty">—</span>
  }
</ng-template>

<ng-template #waterTpl let-value>
  @if (value) {
    {{ value.prev }} → {{ value.curr }}
    <span class="reading-log__used">({{ value.curr - value.prev }} m³)</span>
  } @else {
    <span class="reading-log__empty">—</span>
  }
</ng-template>

<ng-template #recordedAtTpl let-value>
  @if (value) {
    {{ value | date:'dd/MM/yyyy' }}
  } @else {
    <span class="reading-log__empty">—</span>
  }
</ng-template>
